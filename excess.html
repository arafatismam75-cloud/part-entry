<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excess Cut Entry - Part Entry ERP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="dashboard">
  <div class="overlay" id="overlay" onclick="closeSidebarMobile()"></div>
  <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">PART <span>ENTRY</span></div>
    <nav class="sidebar-nav">
      <a href="index.html"> Dashboard</a>
      <a href="index.html">➕ New Entry</a>
      <a href="index.html"> Part List</a>

      <a class="has-submenu open" onclick="toggleSubmenu(this)">
        ✂️ Excess Cutting
        <span class="arrow">▶</span>
      </a>
      <div class="submenu open" id="excessSubmenu">
        <a href="excess.html" class="active">➕ Excess Cut Entry</a>
        <a href="excess-view.html"> View Data</a>
        <a href="report.html"> Reports</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">👤 <span id="userRole">Operator</span></div>
      <button id="logout">Logout</button>
    </div>
  </aside>

  <main class="main-content" id="mainContent">
    <div class="topbar">
      <h1>Excess Cut Entry</h1>
    </div>
    
    <div class="entry">
      <h2>Enter Excess Cutting Details</h2>
      <div class="form-row">
        <div class="form-group">
          <label>SR No</label>
          <input id="srNo" placeholder="Enter SR No">
        </div>
        <div class="form-group">
          <label>Floor</label>
          <select id="floor">
            <option value="">Select Floor</option>
            <option value="Cutting-1">Cutting-1</option>
            <option value="Cutting-2">Cutting-2</option>
            <option value="Cutting-3">Cutting-3</option>
            <option value="Cutting-4">Cutting-4</option>
          </select>
        </div>
        <div class="form-group">
          <label>Buyer Name</label>
          <input id="buyerName" placeholder="Enter buyer name">
        </div>
        <div class="form-group">
          <label>Style No</label>
          <input id="styleNo" placeholder="Enter style no">
        </div>
        <div class="form-group">
          <label>Table No</label>
          <input id="tableNo" placeholder="Enter Table No">
        </div>
        <div class="form-group">
          <label>Cut Qty</label>
          <input id="cutQty" type="number" placeholder="0">
        </div>
        <div class="form-group">
          <label>Excess Qty</label>
          <input id="excessQty" type="number" placeholder="0">
        </div>
        <div class="form-group">
          <label>Color</label>
          <input id="color" placeholder="Enter color">
        </div>
        <div class="form-group">
          <label>Delivery Date</label>
          <input id="deliveryDate" type="date">
        </div>
        <div class="form-group">
          <label>Remarks</label>
          <input id="remarks" placeholder="Enter remarks">
        </div>
      </div>
      <button id="saveExcess"> Save Entry</button>
      <button id="cancelExcessEdit" style="display:none;">Cancel Edit</button>
    </div>
  </main>
</div>

<script type="module" src="excess.js"></script>
<script>
  function toggleSubmenu(el) {
    el.classList.toggle('open');
    document.getElementById('excessSubmenu').classList.toggle('open');
  }
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('mainContent');
    const btn = document.getElementById('toggleBtn');
    const overlay = document.getElementById('overlay');
    if (window.innerWidth <= 900) { sidebar.classList.toggle('open'); overlay.classList.toggle('active'); } 
    else { sidebar.classList.toggle('hidden'); main.classList.toggle('full'); btn.classList.toggle('shifted'); }
  }
  function closeSidebarMobile() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('active');
  }
  window.addEventListener('resize', () => {
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('mainContent');
    const btn = document.getElementById('toggleBtn');
    const overlay = document.getElementById('overlay');
    if (window.innerWidth <= 900) {
      sidebar.classList.remove('hidden'); main.classList.remove('full'); btn.classList.remove('shifted'); overlay.classList.remove('active');
    } else {
      sidebar.classList.remove('open'); overlay.classList.remove('active');
    }
  });
  function showToast(message, type = 'success') {
    let container = document.getElementById('toastContainer');
    if (!container) { container = document.createElement('div'); container.id = 'toastContainer'; document.body.appendChild(container); }
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerHTML = `<span class="toast-icon">${type === 'success' ? '✅' : '⚠️'}</span><span class="toast-msg">${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
  }
  window.showToast = showToast;
</script>
</body>
</html>
