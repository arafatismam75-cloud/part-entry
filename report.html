<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - Excess Cutting</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="dashboard">

  <div class="overlay" id="overlay" onclick="closeSidebarMobile()"></div>
  <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">PART <span>ENTRY</span></div>
    <nav class="sidebar-nav">
      <a href="index.html">📊 Dashboard</a>
      <a href="index.html">➕ New Entry</a>
      <a href="index.html">📋 Part List</a>

      <a class="has-submenu open" onclick="toggleSubmenu(this)">
        ✂️ Excess Cutting
        <span class="arrow">▶</span>
      </a>
      <div class="submenu open" id="excessSubmenu">
        <a href="excess.html">➕ Excess Cut Entry</a>
        <a href="excess.html">📋 View Data</a>
        <a href="report.html" class="active">📊 Reports</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">👤 <span id="userRole">Operator</span></div>
      <button id="logout">Logout</button>
    </div>
  </aside>

  <main class="main-content" id="mainContent">

    <div class="topbar">
      <h1>Reports — Excess Cutting</h1>
      <button class="btn-primary" onclick="exportReportPDF()" style="margin:0; padding:10px 22px; font-size:14px;">📄 Export PDF</button>
    </div>

    <!-- FILTERS -->
    <div class="entry">
      <h2>Filters</h2>
      <div class="form-row">

        <div class="form-group">
          <label>Buyer</label>
          <select id="filterBuyer">
            <option value="">All Buyers</option>
          </select>
        </div>

        <div class="form-group">
          <label>SR No</label>
          <select id="filterSR">
            <option value="">All SR</option>
          </select>
        </div>

        <div class="form-group">
          <label>Style</label>
          <select id="filterStyle">
            <option value="">All Styles</option>
          </select>
        </div>

        <div class="form-group">
          <label>Color</label>
          <select id="filterColor">
            <option value="">All Colors</option>
          </select>
        </div>

      </div>
      <button class="btn-primary" onclick="applyFilters()" style="margin-top:15px;">🔍 Apply Filters</button>
      <button class="btn-primary" onclick="clearFilters()" style="margin-top:15px; background:#2a2b30;">Clear</button>
    </div>

    <!-- STATS -->
    <div class="cards">
      <div class="card">
        <h3>Total Entries</h3>
        <h2 id="statEntries">0</h2>
      </div>
      <div class="card">
        <h3>Total Cut Qty</h3>
        <h2 id="statCutQty">0</h2>
      </div>
      <div class="card">
        <h3>Total Excess Qty</h3>
        <h2 id="statExcessQty">0</h2>
      </div>
      <div class="card">
        <h3>Total Styles</h3>
        <h2 id="statStyles">0</h2>
      </div>
    </div>

    <!-- REPORT AREA -->
    <div id="reportArea">
      <div class="entry">
        <div class="empty" style="padding:40px;">Loading report...</div>
      </div>
    </div>

  </main>
</div>

<script type="module" src="report.js"></script>

<script>
  function toggleSubmenu(el) {
    el.classList.toggle('open');
    document.getElementById('excessSubmenu').classList.toggle('open');
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('mainContent');
    const btn = document.getElementById('toggleBtn');
    const overlay = document.getElementById('overlay');
    if (window.innerWidth <= 900) {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    } else {
      sidebar.classList.toggle('hidden');
      main.classList.toggle('full');
      btn.classList.toggle('shifted');
    }
  }

  function closeSidebarMobile() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('active');
  }

  window.addEventListener('resize', () => {
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('mainContent');
    const btn = document.getElementById('toggleBtn');
    const overlay = document.getElementById('overlay');
    if (window.innerWidth <= 900) {
      sidebar.classList.remove('hidden');
      main.classList.remove('full');
      btn.classList.remove('shifted');
      overlay.classList.remove('active');
    } else {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }
  });

  function showToast(message, type = 'success') {
    let container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toastContainer';
      document.body.appendChild(container);
    }
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerHTML = `
      <span class="toast-icon">${type === 'success' ? '✅' : '⚠️'}</span>
      <span class="toast-msg">${message}</span>
    `;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 400);
    }, 3000);
  }

  window.showToast = showToast;
</script>

</body>
</html>
