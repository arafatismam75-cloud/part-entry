<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - Excess Cutting</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ===== CUSTOM DROPDOWN ===== */
  .custom-select {
    position: relative;
    width: 100%;
  }
  .custom-select-display {
    width: 100%;
    min-height: 44px;
    padding: 10px 36px 10px 14px;
    background: #121316;
    border: 1px solid #2a2b30;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    transition: all 0.2s;
    position: relative;
    box-sizing: border-box;
    user-select: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .custom-select-display:hover { border-color: #3b75d4; }
  .custom-select-display.open {
    border-color: #4d8aea;
    box-shadow: 0 0 0 3px rgba(77, 138, 234, 0.15);
  }
  .custom-select-display::after {
    content: "";
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e8f96' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-size: contain;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .custom-select-display.open::after {
    transform: translateY(-50%) rotate(180deg);
  }
  .custom-select-display.placeholder {
    color: #6b6c72;
  }

  .custom-select-panel {
    display: none;
    position: absolute;
    top: calc(100% + 5px);
    left: 0;
    right: 0;
    background: #1a1b1f;
    border: 1px solid #2a2b30;
    border-radius: 10px;
    z-index: 600;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  .custom-select-panel.open { display: block; }

  .custom-select-search {
    padding: 10px 12px;
    border-bottom: 1px solid #2a2b30;
  }
  .custom-select-search input {
    width: 100%;
    padding: 8px 12px;
    background: #121316;
    border: 1px solid #2a2b30;
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  .custom-select-search input::placeholder { color: #6b6c72; }
  .custom-select-search input:focus { border-color: #4d8aea; }

  .custom-select-options {
    max-height: 220px;
    overflow-y: auto;
    padding: 6px;
  }
  .custom-select-options::-webkit-scrollbar {
    width: 8px;
  }
  .custom-select-options::-webkit-scrollbar-track {
    background: #121316;
    border-radius: 4px;
  }
  .custom-select-options::-webkit-scrollbar-thumb {
    background: #3a3b40;
    border-radius: 4px;
  }
  .custom-select-options::-webkit-scrollbar-thumb:hover {
    background: #4d8aea;
  }

  .custom-select-option {
    padding: 9px 12px;
    border-radius: 6px;
    color: #d1d1d6;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .custom-select-option:hover {
    background: #232429;
    color: #fff;
  }
  .custom-select-option.selected {
    background: #232429;
    color: #4d8aea;
    font-weight: 600;
  }
  .custom-select-option.selected::after {
    content: "✓";
    color: #4d8aea;
    font-weight: 700;
  }
  .custom-select-option.empty {
    color: #6b6c72;
    cursor: default;
    justify-content: center;
  }
  .custom-select-option.empty:hover {
    background: transparent;
  }
</style>
</head>

<body>

<div id="dashboard">

  <div class="overlay" id="overlay" onclick="closeSidebarMobile()"></div>
  <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">PART <span>ENTRY</span></div>
    <nav class="sidebar-nav">
      <a href="index.html"> Dashboard</a>
      <a href="index.html">➕ New Entry</a>
      <a href="index.html"> Part List</a>

      <a class="has-submenu open" onclick="toggleSubmenu(this)">
        ✂️ Excess Cutting
        <span class="arrow">▶</span>
      </a>
      <div class="submenu open" id="excessSubmenu">
        <a href="excess.html">➕ Excess Cut Entry</a>
        <a href="excess.html"> View Data</a>
        <a href="report.html" class="active">Reports</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">👤 <span id="userRole">Operator</span></div>
      <button id="logout">Logout</button>
    </div>
  </aside>

  <main class="main-content" id="mainContent">

    <div class="topbar">
      <h1>Reports — Excess Cutting</h1>
      <button class="btn-primary" onclick="exportReportPDF()" style="margin:0; padding:10px 22px; font-size:14px;">📄 Export PDF</button>
    </div>

    <!-- FILTERS -->
    <div class="entry">
      <h2>Filters</h2>
      <div class="form-row">

        <!-- BUYER -->
        <div class="form-group">
          <label>Buyer</label>
          <div class="custom-select" id="buyerSelect">
            <div class="custom-select-display placeholder" id="buyerDisplay" onclick="toggleCustomSelect('buyer')">All Buyers</div>
            <div class="custom-select-panel" id="buyerPanel">
              <div class="custom-select-search">
                <input type="text" placeholder="Search buyer..." oninput="filterOptions('buyer', this.value)">
              </div>
              <div class="custom-select-options" id="buyerOptions"></div>
            </div>
          </div>
        </div>

        <!-- SR -->
        <div class="form-group">
          <label>SR No</label>
          <div class="custom-select" id="srSelect">
            <div class="custom-select-display placeholder" id="srDisplay" onclick="toggleCustomSelect('sr')">All SR</div>
            <div class="custom-select-panel" id="srPanel">
              <div class="custom-select-search">
                <input type="text" placeholder="Search SR..." oninput="filterOptions('sr', this.value)">
              </div>
              <div class="custom-select-options" id="srOptions"></div>
            </div>
          </div>
        </div>

        <!-- STYLE -->
        <div class="form-group">
          <label>Style</label>
          <div class="custom-select" id="styleSelect">
            <div class="custom-select-display placeholder" id="styleDisplay" onclick="toggleCustomSelect('style')">All Styles</div>
            <div class="custom-select-panel" id="stylePanel">
              <div class="custom-select-search">
                <input type="text" placeholder="Search style..." oninput="filterOptions('style', this.value)">
              </div>
              <div class="custom-select-options" id="styleOptions"></div>
            </div>
          </div>
        </div>

        <!-- COLOR -->
        <div class="form-group">
          <label>Color</label>
          <div class="custom-select" id="colorSelect">
            <div class="custom-select-display placeholder" id="colorDisplay" onclick="toggleCustomSelect('color')">All Colors</div>
            <div class="custom-select-panel" id="colorPanel">
              <div class="custom-select-search">
                <input type="text" placeholder="Search color..." oninput="filterOptions('color', this.value)">
              </div>
              <div class="custom-select-options" id="colorOptions"></div>
            </div>
          </div>
        </div>

      </div>
      <button class="btn-primary" onclick="applyFilters()" style="margin-top:15px;">🔍 Apply Filters</button>
      <button class="btn-primary" onclick="clearFilters()" style="margin-top:15px; background:#2a2b30;">Clear</button>
    </div>

    <!-- STATS -->
    <div class="cards">
      <div class="card"><h3>Total Entries</h3><h2 id="statEntries">0</h2></div>
      <div class="card"><h3>Total Cut Qty</h3><h2 id="statCutQty">0</h2></div>
      <div class="card"><h3>Total Excess Qty</h3><h2 id="statExcessQty">0</h2></div>
      <div class="card"><h3>Total Styles</h3><h2 id="statStyles">0</h2></div>
    </div>

    <!-- REPORT AREA -->
    <div id="reportArea">
      <div class="entry">
        <div class="empty" style="padding:40px; text-align:center;">Loading report...</div>
      </div>
    </div>

  </main>
</div>

<script type="module" src="report.js"></script>

<script>
  function toggleSubmenu(el) {
    el.classList.toggle('open');
    document.getElementById('excessSubmenu').classList.toggle('open');
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('mainContent');
    const btn = document.getElementById('toggleBtn');
    const overlay = document.getElementById('overlay');
    if (window.innerWidth <= 900) {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    } else {
      sidebar.classList.toggle('hidden');
      main.classList.toggle('full');
      btn.classList.toggle('shifted');
    }
  }

  function closeSidebarMobile() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('active');
  }

  window.addEventListener('resize', () => {
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('mainContent');
    const btn = document.getElementById('toggleBtn');
    const overlay = document.getElementById('overlay');
    if (window.innerWidth <= 900) {
      sidebar.classList.remove('hidden'); main.classList.remove('full'); btn.classList.remove('shifted'); overlay.classList.remove('active');
    } else {
      sidebar.classList.remove('open'); overlay.classList.remove('active');
    }
  });

  function showToast(message, type = 'success') {
    let container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toastContainer';
      document.body.appendChild(container);
    }
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerHTML = `<span class="toast-icon">${type === 'success' ? '✅' : '⚠️'}</span><span class="toast-msg">${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
  }
  window.showToast = showToast;

  // ===== CUSTOM SELECT TOGGLE =====
  window.toggleCustomSelect = function (type) {
    const panel = document.getElementById(type + 'Panel');
    const display = document.getElementById(type + 'Display');
    const isOpen = panel.classList.contains('open');

    document.querySelectorAll('.custom-select-panel').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.custom-select-display').forEach(d => d.classList.remove('open'));

    if (!isOpen) {
      panel.classList.add('open');
      display.classList.add('open');
      // সার্চ বক্সে ফোকাস
      const searchInput = panel.querySelector('input');
      if (searchInput) setTimeout(() => searchInput.focus(), 50);
    }
  };

  // বাইরে ক্লিক করলে সব বন্ধ
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.custom-select')) {
      document.querySelectorAll('.custom-select-panel').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.custom-select-display').forEach(d => d.classList.remove('open'));
    }
  });

  // প্যানেলের ভেতরে ক্লিক করলে বন্ধ হবে না
  document.querySelectorAll('.custom-select-panel').forEach(panel => {
    panel.addEventListener('click', (e) => e.stopPropagation());
  });

  // ===== FILTER OPTIONS BY SEARCH =====
  window.filterOptions = function (type, searchTerm) {
    const options = document.querySelectorAll('#' + type + 'Options .custom-select-option');
    const term = searchTerm.toLowerCase();
    options.forEach(opt => {
      const text = opt.textContent.toLowerCase();
      opt.style.display = text.includes(term) ? 'flex' : 'none';
    });
  };
</script>

</body>
</html>
