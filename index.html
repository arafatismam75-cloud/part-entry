<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part Entry ERP</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== LOGIN PAGE ===== -->
<div class="login-box" id="loginBox">
  <h1>Part Entry ERP</h1>
  <p>Login to continue</p>

  <form onsubmit="return false;">
    <input type="text" placeholder="Enter your name">
    <input type="password" placeholder="Enter your password">
    <input type="submit" value="Login">
  </form>

  <button id="googleLogin">Sign in with Google</button>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboard" style="display:none;">

  <!-- HEADER -->
  <header>
    <h1>Part Entry Dashboard</h1>
    <button id="logout">Logout</button>
  </header>

  <!-- SUMMARY CARDS -->
  <div class="cards">
    <div class="card">
      <h3>Total Part</h3>
      <h2 id="totalPart">0</h2>
    </div>
    <div class="card">
      <h3>Total Order Qty</h3>
      <h2 id="totalQty">0</h2>
    </div>
    <div class="card">
      <h3>User</h3>
      <h2 id="userRole">Operator</h2>
    </div>
  </div>

  <!-- ENTRY FORM -->
  <section class="entry">
    <h2>Part Entry</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Part Name</label>
        <input id="partName" placeholder="Enter part name">
      </div>
      <div class="form-group">
        <label>Buyer Name</label>
        <input id="buyerName" placeholder="Enter buyer name">
      </div>
      <div class="form-group">
        <label>Style No</label>
        <input id="styleNo" placeholder="Enter style no">
      </div>
      <div class="form-group">
        <label>PO No</label>
        <input id="poNo" placeholder="Enter PO no">
      </div>
      <div class="form-group">
        <label>Order Qty</label>
        <input id="orderQty" type="number" placeholder="0">
      </div>
      <div class="form-group">
        <label>Color</label>
        <input id="color" placeholder="Enter color">
      </div>
      <div class="form-group">
        <label>Print</label>
        <input id="print" placeholder="Enter print details">
      </div>
      <div class="form-group">
        <label>Embroidery</label>
        <input id="embroidery" placeholder="Enter embroidery details">
      </div>
      <div class="form-group">
        <label>Delivery Date</label>
        <input id="deliveryDate" type="date">
      </div>
    </div>
    <button id="savePart">💾 Save Part</button>
    <button id="cancelEdit" style="display:none;">Cancel Edit</button>
  </section>

  <!-- SEARCH -->
  <section class="entry">
    <h2>Search</h2>
    <div class="form-group">
      <label>Search Part / Buyer / Style</label>
      <input id="searchBox" placeholder="Type to search...">
    </div>
  </section>

  <!-- TABLE -->
  <section>
    <h2 style="text-align:center; margin:25px 0 0; font-size:24px; color:#fff;">Part List</h2>
    <table>
      <thead>
        <tr>
          <th>Part</th>
          <th>Buyer</th>
          <th>Style</th>
          <th>Qty</th>
          <th>Color</th>
          <th>Print</th>
          <th>Embroidery</th>
          <th>Delivery</th>
          <th>PO No</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="partTable"></tbody>
    </table>
  </section>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
